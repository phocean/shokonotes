name: CI

# Manual only until a run passes. Then put back `push: branches: [main]`
# and `pull_request:`.
on:
  workflow_dispatch:

jobs:
  build:
    # The app icon is an Icon Composer `.icon`, which needs Xcode 26 or later.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The App Store builds are made with Xcode 27 on the developer's Mac.
      # CI takes the newest Xcode on the runner (beta included: it only checks
      # that the code compiles, it never produces what ships), so the code
      # must also build with the older compiler the image may still carry.
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Mac app
        run: |
          xcodebuild -project Shokonotes.xcodeproj -scheme Shokonotes \
            -configuration Release -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Build iPhone app
        run: |
          xcodebuild -project Shokonotes.xcodeproj -scheme ShokonotesIOS \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Test
        run: |
          xcodebuild -project Shokonotes.xcodeproj -scheme Shokonotes \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
